<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Universe Medical Center · Porcelain & Crimson icon -->
  <defs>
    <linearGradient id="oxblood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1A1D"/>
      <stop offset="1" stop-color="#4A0F18"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#oxblood)"/>
  <!-- stethoscope circle -->
  <circle cx="256" cy="252" r="164" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-dasharray="880 160" transform="rotate(118 256 252)"/>
  <!-- crimson U -->
  <path d="M186 176 v96 a70 70 0 0 0 140 0 v-96" fill="none" stroke="#E3202B" stroke-width="46" stroke-linecap="round"/>
  <!-- white M -->
  <path d="M272 344 V186 l60 92 60-92 v158" fill="none" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cross node -->
  <circle cx="256" cy="112" r="26" fill="#E3202B"/>
  <path d="M256 99 v26 M243 112 h26" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- heartbeat node -->
  <circle cx="384" cy="330" r="18" fill="#E3202B"/>
  <!-- ecg tick -->
  <path d="M96 402 h56 l10-16 14 28 12-40 10 18 h40" fill="none" stroke="#E3202B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
